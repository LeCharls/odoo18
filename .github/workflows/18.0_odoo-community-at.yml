# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - odoo-community-at

on:
  push:
    branches:
      - 18.0
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mcr.microsoft.com/
        username: ${{ secrets.AzureAppService_ContainerUsername_4052742f83644b4599662395143d03b0 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_e556cd2a80174e51a42ae33cea3cf8ec }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_4052742f83644b4599662395143d03b0 }}/appsvc/staticsite:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'odoo-community-at'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_252373b02a7b4796b6fae723dd2075b9 }}
        images: 'mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_4052742f83644b4599662395143d03b0 }}/appsvc/staticsite:${{ github.sha }}'